[package]
name = "tinyaxum"
version = "0.1.0"
edition = "2024"
publish = false
description = "TinyAxum — Axum + SvelteKit application skeleton"
default-run = "tinyaxum"

[dependencies]
anyhow = "1.0"
axum = "0.8.4"
axum-extra = { version = "0.12.1", features = ["typed-header", "cookie"] }
cookie = { version = "0.18", features = ["percent-encode"] }
tower-http = { version = "0.6", features = ["trace", "fs", "cors"] }
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tracing = { version = "0.1", features = ["attributes"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
config = "0.15.19"
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.20", features = ["derive"] }
bcrypt = "0.17"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.9"
percent-encoding = "2.3"
toml = "1.1"
toml_edit = "0.25"
regex = "1.12.2"
sea-orm = { version = "2.0.0-rc", features = [
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-uuid",
    "with-json",
] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

[dev-dependencies]
tempfile = "3"
