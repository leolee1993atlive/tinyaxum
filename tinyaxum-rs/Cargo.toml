[package]
name = "tinyaxum"
version = "0.1.0"
edition = "2024"
publish = false
description = "TinyAxum — Axum + SvelteKit application skeleton"
default-run = "tinyaxum"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie"] }
cookie = { version = "0.18.2", features = ["percent-encode"] }
tower-http = { version = "0.7.1", features = ["trace", "fs", "cors"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
config = "0.15.27"
chrono = { version = "0.4.45", features = ["serde"] }
validator = { version = "0.21.0", features = ["derive"] }
bcrypt = "0.19.3"
aes-gcm = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
percent-encoding = "2.3.2"
toml = "1.1.8"
toml_edit = "0.25.17"
regex = "1.13.1"
sea-orm = { version = "2.0.4", features = [
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-uuid",
    "with-json",
] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"

[dev-dependencies]
tempfile = "3.27.0"
